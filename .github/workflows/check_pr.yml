name: Check PR
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
jobs:
  check_pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: yarn install --frozen-lockfile
        shell: bash
      - run: yarn test
        shell: bash
